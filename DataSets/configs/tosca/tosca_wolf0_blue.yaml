# Auto-generated config for TOSCA shape: wolf0, texture: blue
# Generated by: scripts/generate_tosca_training_patches.sh
#
# Usage:
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_wolf0_blue.yaml

# Dataset class for loading training data
dataset_class: GaussianPatchDataset

# Paths
# gaussian_output points to a .txt file listing all Gaussian output folders
gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_wolf0_blue_all.txt"
geodesic_data: null  # Auto-detect from {gaussian_output}/geodesic_distance/gt_geodesic.npz
output_dir: "TrainData/datasets/gaussian_patches/tosca_wolf0_blue"
tosca_data_root: "TrainData/TOSCA/processed"
shape: "wolf0"
iteration: null      # Use highest available iteration

# Data generation parameters
num_iterations: 1000
num_sources: 4
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 6
adaptive_target_ring: 3
adaptive_target_neighbors: 192
adaptive_k_boost: 16
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 10
disable_outlier_filtering: true
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 64
    3: 192
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0

# Dataset info
dataset:
  name: "TOSCA wolf0 (blue texture)"
  type: "TOSCA"
  description: "Training patches for TOSCA shape 'wolf0' with blue texture across high_res resolution(s) and 0,1,2,3,4 light condition(s)"
