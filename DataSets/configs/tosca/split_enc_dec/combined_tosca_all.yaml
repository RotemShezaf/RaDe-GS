# Combined TOSCA config – ALL animals with outlier filtering enabled
# Variant: split_enc_dec with outlier filtering, n_neighbors=10, adaptive_k_boost=16
# For use with SplitEmbeddingEncoderDecoderTransformer
#
# Usage:
#   from DataSets.gaussian_dataset import CombinedGaussianPatchDataset
#   dataset = CombinedGaussianPatchDataset(
#       config='DataSets/configs/tosca/split_enc_dec/combined_tosca_all.yaml',
#       attributes=['xyz'], ring=3
#   )

dataset_class: CombinedGaussianPatchDataset

output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_combined_all"

data_sources:
  - name: "tosca_cat"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_cat"
    weight: 1.0
    iteration: null

  - name: "tosca_centaur"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_centaur"
    weight: 1.0
    iteration: null

  - name: "tosca_david"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_david"
    weight: 1.0
    iteration: null

  - name: "tosca_dog"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_dog"
    weight: 1.0
    iteration: null

  - name: "tosca_gorilla"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_gorilla"
    weight: 1.0
    iteration: null

  - name: "tosca_horse"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_horse"
    weight: 1.0
    iteration: null

  - name: "tosca_michael"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_michael"
    weight: 1.0
    iteration: null

  - name: "tosca_victoria"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_victoria"
    weight: 1.0
    iteration: null

  - name: "tosca_wolf"
    gaussian_output: null
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/tosca_wolf"
    weight: 1.0
    iteration: null

# Data generation parameters (shared across all sources)
num_iterations: 1000
num_sources: 3
num_train_points: 50
seed: 42

use_mahalanobis: false
n_neighbors: 10
adaptive_target_ring: 3
adaptive_target_neighbors: 192
adaptive_k_boost: 16
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 8
normalize_per_patch: false

# Outlier filtering (without p_u — inference-path filter)
disable_outlier_filtering: false
outlier_median_multiplier: 3.0
outlier_threshold_floor: 2.0
outlier_hard_cap: 50.0
outlier_fallback_multiplier: 5.0
outlier_fallback_floor: 3.0
outlier_max_removal_fraction: null

rings: [2, 3]

ring_size_mapping:
  euclidean:
    2: 64
    3: 192
    4: 512

attributes:
  - xyz

# Normalization: use all valid neighbors for max_dist computation
normalize_all_neighbors: true
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0
