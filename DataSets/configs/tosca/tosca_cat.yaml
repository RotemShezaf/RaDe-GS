# TOSCA Cat - blue_texture, high_res, decoupled_appearance
#
# 9 poses of cat mesh (diagonal ~223.5)
#
# Usage:
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_cat.yaml

# Dataset class for loading training data
dataset_class: GaussianPatchDataset

# Paths
gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_cat_blue.txt"
geodesic_data: null  # Auto-detect from {gaussian_output}/geodesic_distance/gt_geodesic.npz
output_dir: "TrainData/datasets/gaussian_patches/tosca_cat"
iteration: null      # Use highest available iteration

# Data generation parameters
num_iterations: 1000
num_sources: 2
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 6
adaptive_target_ring: 3
adaptive_target_neighbors: 192
adaptive_k_boost: 16
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 10
disable_outlier_filtering: true
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 64
    3: 192
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0

# Dataset info
dataset:
  name: "TOSCA Cat (9 poses)"
  type: "TOSCA"
  description: "Training examples from TOSCA cat mesh across 9 poses, blue_texture, decoupled_appearance"
  characteristics:
    - "Animal: cat"
    - "Mesh diagonal: ~223.5"
    - "9 poses"
    - "blue_texture, high_res, decoupled_appearance"
    - "Attributes: xyz"