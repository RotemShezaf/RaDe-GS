# Multi-source configuration combining ALL TOSCA animals
# Variant: xyz + scale + opacity
#
# Uses CombinedGaussianPatchDataset to load training data
# from all 12 TOSCA animal types with a total of 148 poses.
#
# Workflow:
# 1. First generate patches for each animal:
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_cat_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_centaur_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_david_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_dog_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_gorilla_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_horse_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_lioness_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_michael_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_seahorse_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_shark_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_victoria_scale_opacity.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/tosca/tosca_wolf_scale_opacity.yaml
#
# 2. Load with CombinedGaussianPatchDataset:
#      from DataSets.gaussian_dataset import CombinedGaussianPatchDataset
#      dataset = CombinedGaussianPatchDataset(
#          config="DataSets/configs/tosca/combined_tosca_all_scale_opacity.yaml",
#          attributes=['xyz', 'scale', 'opacity'],
#          ring=2,
#      )

# Dataset class for loading training data
dataset_class: CombinedGaussianPatchDataset

# Base output directory
output_dir: "TrainData/datasets/gaussian_patches/combined_tosca_all_scale_opacity"

# Multiple data sources - one per TOSCA animal type
data_sources:
  - name: "tosca_cat"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_cat_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_cat_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_centaur"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_centaur_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_centaur_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_david"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_david_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_david_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_dog"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_dog_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_dog_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_gorilla"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_gorilla_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_gorilla_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_horse"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_horse_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_horse_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_lioness"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_lioness_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_lioness_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_michael"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_michael_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_michael_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_seahorse"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_seahorse_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_seahorse_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_shark"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_shark_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_shark_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_victoria"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_victoria_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_victoria_scale_opacity"
    weight: 1.0
    iteration: null

  - name: "tosca_wolf"
    gaussian_output: "DataSets/configs/tosca/gaussian_sources/tosca_wolf_blue.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/tosca_wolf_scale_opacity"
    weight: 1.0
    iteration: null

# Data generation parameters (shared across all sources)
num_iterations: 1000
num_sources: 4
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 6
adaptive_target_ring: 3
adaptive_target_neighbors: 192
adaptive_k_boost: 16
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 10
disable_outlier_filtering: true
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 64
    3: 192
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz
  - scale
  - opacity

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0

# Dataset info
dataset:
  name: "Combined TOSCA Animals (148 poses, xyz+scale+opacity)"
  type: "Multi-source"
  description: "Training examples from all 12 TOSCA animal types, blue_texture, decoupled_appearance"
  characteristics:
    - "Cat: 9 poses (diagonal ~223.5)"
    - "Centaur: 6 poses (diagonal ~288.8)"
    - "David: 15 poses (diagonal ~234.7)"
    - "Dog: 11 poses (diagonal ~198.4)"
    - "Gorilla: 21 poses (diagonal ~188.6)"
    - "Horse: 17 poses (diagonal ~330.0)"
    - "Lioness: 15 poses (diagonal ~290.5)"
    - "Michael: 20 poses (diagonal ~261.9)"
    - "Seahorse: 6 poses (diagonal ~482.8)"
    - "Shark: 1 poses (diagonal ~531.6)"
    - "Victoria: 24 poses (diagonal ~243.4)"
    - "Wolf: 3 poses (diagonal ~200.0)"
    - "148 total poses for maximum diversity"
    - "Weighted sampling for balanced training"
    - "Attributes: xyz + scale + opacity"
