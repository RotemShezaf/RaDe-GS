# Configuration for Saddle surface - ALL levels and lighting conditions
# Variant: one source (num_sources=1)
#
# Combines 15 Gaussian outputs (3 levels × 5 lights) from blue_texture Saddle
# into a single training dataset. Each training example uses exactly 1 geodesic
# source (simulates early-wavefront / sparse visited-neighbor regime).
#
# Usage:
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/saddle_all_one_source.yaml

# Dataset class for loading training data
dataset_class: GaussianPatchDataset

# Paths
# gaussian_output points to a .txt file listing all 15 output folders
gaussian_output: "DataSets/configs/polynomial/gaussian_sources/saddle_blue_all.txt"
geodesic_data: null  # Auto-detect from {gaussian_output}/geodesic_distance/gt_geodesic.npz
output_dir: "TrainData/datasets/gaussian_patches/saddle_all_one_source"
iteration: null      # Use highest available iteration

# Data generation parameters
num_iterations: 1000
num_sources: 1
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 14
# Adaptive kNN
adaptive_target_ring: 3
adaptive_target_neighbors: 128
adaptive_k_boost: 20
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 6
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 48
    3: 128
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz

# Outlier filtering
disable_outlier_filtering: true

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
