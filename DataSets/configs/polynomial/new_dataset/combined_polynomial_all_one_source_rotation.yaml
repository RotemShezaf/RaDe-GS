# Multi-source configuration combining ALL polynomial surfaces
# Variant: one source (num_sources=1) + rotation attribute
#
# Based on combined_polynomial_all_one_source.yaml with rotation added
# to attributes.  Each data_source output_dir points to the _rotation
# variant so patches are generated with xyz + rotation features.
#
# Workflow:
# 1. Generate patches for each surface:
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/new_dataset/paraboloid_all_one_source_rotation.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/new_dataset/saddle_all_one_source_rotation.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/new_dataset/hyperbolic_paraboloid_all_one_source_rotation.yaml
#
# 2. Load with CombinedGaussianPatchDataset:
#      from DataSets.gaussian_dataset import CombinedGaussianPatchDataset
#      dataset = CombinedGaussianPatchDataset(
#          config="DataSets/configs/polynomial/new_dataset/combined_polynomial_all_one_source_rotation.yaml",
#          attributes=["xyz", "rotation"],
#          ring=3,
#      )

# Dataset class for loading training data
dataset_class: CombinedGaussianPatchDataset

# Base output directory
output_dir: "TrainData/datasets/gaussian_patches/new_dataset/combined_polynomial_all_one_source_rotation"

# Multiple data sources - one per polynomial surface type
data_sources:
  - name: "paraboloid_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/paraboloid_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/new_dataset/paraboloid_all_one_source_rotation"
    surface_type: Paraboloid
    weight: 1.0
    iteration: null

  - name: "saddle_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/saddle_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/new_dataset/saddle_all_one_source_rotation"
    surface_type: Saddle
    weight: 1.0
    iteration: null

  - name: "hyperbolic_paraboloid_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/hyperbolic_paraboloid_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/new_dataset/hyperbolic_paraboloid_all_one_source_rotation"
    surface_type: HyperbolicParaboloid
    weight: 1.0
    iteration: null

# Data generation parameters (shared across all sources)
num_iterations: 1000
num_sources: 1
num_train_points: 50
seed: 42

# Near-source oversampling
near_source_oversample: 0.3

# Neighborhood computation (matched to scripts/polynomial/run_adaptive_analysis.sh)
use_mahalanobis: false
n_neighbors: 14
adaptive_target_ring: 3
adaptive_target_neighbors: 128
adaptive_k_boost: 20
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 6
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 48
    3: 128
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz
  - rotation

# Outlier filtering
disable_outlier_filtering: true

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0

# Dataset info
dataset:
  name: "Combined Polynomial Surfaces – new_dataset, rotation (all levels & lights)"
  type: "Multi-source"
  description: >
    Training examples from all 3 polynomial surfaces with xyz + rotation
    attributes and one geodesic source per patch.
  characteristics:
    - "Paraboloid: positive curvature (15 outputs)"
    - "Saddle: negative curvature (15 outputs)"
    - "HyperbolicParaboloid: mixed curvature (15 outputs)"
    - "45 total Gaussian outputs"
    - "Attributes: xyz + rotation (quaternion)"
    - "Weighted sampling for balanced training"
