# Configuration for HyperbolicParaboloid surface - ALL levels and lighting conditions
# Variant: one source (num_sources=1) + rotation attribute
#
# Based on hyperbolic_paraboloid_all_one_source.yaml with rotation added to attributes.
#
# Usage:
#   python DataSets/create_gaussian_training_patches.py \
#       --config DataSets/configs/polynomial/new_dataset/hyperbolic_paraboloid_all_one_source_rotation.yaml

# Dataset class for loading training data
dataset_class: GaussianPatchDataset

# Surface type (used by GaussianPatchSurfacePerturb transform)
surface_type: HyperbolicParaboloid

# Paths
gaussian_output: "DataSets/configs/polynomial/gaussian_sources/hyperbolic_paraboloid_blue_all.txt"
geodesic_data: null
output_dir: "TrainData/datasets/gaussian_patches/new_dataset/hyperbolic_paraboloid_all_one_source_rotation"
iteration: null

# Data generation parameters
num_iterations: 1000
num_sources: 1
num_train_points: 50
seed: 42

# Near-source oversampling: 30% of training points drawn with
# inverse-geodesic-distance weighting (biases toward wavefront regime)
near_source_oversample: 0.3

# Neighborhood computation (matched to scripts/polynomial/run_adaptive_analysis.sh)
use_mahalanobis: false
n_neighbors: 14
adaptive_target_ring: 3
adaptive_target_neighbors: 128
adaptive_k_boost: 20
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 6
normalize_per_patch: false

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 48
    3: 128
    4: 512
  mahalanobis:
    2: 90
    3: 250
    4: 600

# Feature attributes
attributes:
  - xyz
  - rotation

# Outlier filtering
disable_outlier_filtering: true

# Normalization and padding
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0
