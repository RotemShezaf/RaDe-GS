# Multi-source configuration combining ALL polynomial surfaces
# Variant: 4 sources (num_sources=4), no outlier filtering, n_neighbors=10, adaptive_k_boost=16
# For use with SplitEmbeddingEncoderDecoderTransformer
#
# Trains on all 3 surfaces (Paraboloid + Saddle + HyperbolicParaboloid)
# with outlier filtering disabled. Patches normalized by all valid neighbors.
#
# Workflow:
# 1. Generate patches for each surface:
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/paraboloid_all.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/saddle_all.yaml
#      python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/hyperbolic_paraboloid_all.yaml
#
# 2. Load with CombinedGaussianPatchDataset:
#      from DataSets.gaussian_dataset import CombinedGaussianPatchDataset
#      dataset = CombinedGaussianPatchDataset(
#          config="DataSets/configs/polynomial/split_enc_dec/combined_polynomial_all.yaml",
#          attributes=["xyz"],
#          ring=3,
#      )

# Dataset class for loading training data
dataset_class: CombinedGaussianPatchDataset

# Base output directory
output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/combined_polynomial_all"

# Multiple data sources - one per polynomial surface type
data_sources:
  - name: "paraboloid_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/paraboloid_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/paraboloid_all"
    surface_type: Paraboloid
    weight: 1.0
    iteration: null

  - name: "saddle_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/saddle_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/saddle_all"
    surface_type: Saddle
    weight: 1.0
    iteration: null

  - name: "hyperbolic_paraboloid_all"
    gaussian_output: "DataSets/configs/polynomial/gaussian_sources/hyperbolic_paraboloid_blue_all.txt"
    geodesic_data: null
    output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/hyperbolic_paraboloid_all"
    surface_type: HyperbolicParaboloid
    weight: 1.0
    iteration: null

# Data generation parameters (shared across all sources)
num_iterations: 1000
num_sources: 4
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 10
adaptive_target_ring: 3
adaptive_target_neighbors: 128
adaptive_k_boost: 16
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 6
normalize_per_patch: false

# Outlier filtering disabled
disable_outlier_filtering: true

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 48
    3: 128
    4: 512

# Feature attributes
attributes:
  - xyz

# Normalization: use all valid neighbors for max_dist computation
normalize_all_neighbors: true
