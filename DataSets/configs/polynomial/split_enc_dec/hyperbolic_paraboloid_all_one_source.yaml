# Configuration for HyperbolicParaboloid surface - ALL levels and lighting conditions
# Variant: one source (num_sources=1), outlier filtering, n_neighbors=16
# For use with SplitEmbeddingEncoderDecoderTransformer
#
# Usage:
#   python DataSets/create_gaussian_training_patches.py \
#       --config DataSets/configs/polynomial/split_enc_dec/hyperbolic_paraboloid_all_one_source.yaml

# Dataset class for loading training data
dataset_class: GaussianPatchDataset

# Surface type (used by GaussianPatchSurfacePerturb transform)
surface_type: HyperbolicParaboloid

# Paths
gaussian_output: "DataSets/configs/polynomial/gaussian_sources/hyperbolic_paraboloid_blue_all.txt"
geodesic_data: null
output_dir: "TrainData/datasets/gaussian_patches/split_enc_dec/hyperbolic_paraboloid_all_one_source"
iteration: null

# Data generation parameters
num_iterations: 1000
num_sources: 1
num_train_points: 50
seed: 42

# Neighborhood computation
use_mahalanobis: false
n_neighbors: 16
adaptive_target_ring: 3
adaptive_target_neighbors: 128
adaptive_k_boost: 22
adaptive_max_mean_cut: 0.00
adaptive_max_steps: 6
normalize_per_patch: true

# Outlier filtering
disable_outlier_filtering: true
outlier_median_multiplier: 3.0
outlier_threshold_floor: 2.0
outlier_hard_cap: 50.0
outlier_fallback_multiplier: 5.0
outlier_fallback_floor: 3.0
outlier_max_removal_fraction: null

# Ring configuration
rings: [2, 3]

# Ring size mapping
ring_size_mapping:
  euclidean:
    2: 48
    3: 128
    4: 512

# Feature attributes
attributes:
  - xyz

# Normalization and padding
normalize_all_neighbors: true
nn_mean: 1
use_r1_min_val: true
mask_constant: -10.0
