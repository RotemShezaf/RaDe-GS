[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tetra-nerf"
version = "0.1.1"
description = "Tetrahedra triangulation for NeRF"
requires-python = ">=3.9"
dependencies = [
    "trimesh>=3.20.2",
    "numpy>=1.20",
]

[tool.setuptools]
packages = ["tetranerf"]
