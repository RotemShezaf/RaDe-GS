# Training config: Combined Polynomial Surfaces – Ring 3 (geodesic_attention)
# Variant: GeodesicEncoderDecoderTransformer – geodesic self-attention encoder
#          on XYZ + standard decoder cross-attending with raw geodesic distances.
#
# Changes from new_dataset/combined_polynomial_ring3.yaml:
#   - attention_type: geodesic_enc_dec (encoder-decoder with GDS-based encoder)
#   - decoder_depth: 3
#   - encoder_type / pos_encoding_type / point_attributes not used by enc-dec model
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/geodesic_attention/combined_polynomial_ring3.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/new_dataset/combined_polynomial_all_one_source.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: SparseContextDropout
      min_valid: 1
      max_valid_ratio: 1.00
      p: 0.7
      p_dropout: 0.3
      max_dropout_ratio: 0.99
    - name: GaussianPatchSurfacePerturb
      surface_type: null
      max_offset: 0.02
      p: 0.5
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 4
  decoder_depth: 3
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.015
  attn_dropout: 0.0015
  drop_path_rate: 0.0015
  pool: max
  attention_type: geodesic_enc_dec

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 100
  batch_size: 256
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 5.0e-5
  loss_type: blended_mse
  gradient_clip_norm: 1.0
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 8
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/geodesic_attention/combined_polynomial_ring3
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: geodesic-enc-dec-combined-polynomial-ring3
  log_file: ./checkpoints/geodesic_attention/combined_polynomial_ring3/train.log
