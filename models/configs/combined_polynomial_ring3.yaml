# Training config: Combined Polynomial Surfaces – Ring 3
# Variant: Conv1d encoder + spatial positional encoding + max pooling + mse loss
# Based on: combined_polynomial_ring2_conv.yaml (ring 2 → ring 3)
#
# Trains GaussianPatchTransformer on the combined polynomial dataset
# (Paraboloid + Saddle + HyperbolicParaboloid, all levels & lights).
#
# Prerequisites – generate patches first:
#   bash scripts/generate_polynomial_training_patches.sh
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/combined_polynomial_ring3.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/combined_polynomial_all.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: GaussianPatchDropout
      max_dropout_ratio: 0.5
  # Full dataset – all examples
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.001
  attn_dropout: 0.001
  drop_path_rate: 0.001
  point_attributes: null  # null = use all attributes
  # pool: max | mean | max_mean  (default: max)
  pool: max
  # pos_encoding_type: index | spatial | relative_bias
  #   index   – sinusoidal on sorted-neighbour order (default)
  #   spatial – sinusoidal on relative 3-D XYZ position (requires xyz in attributes)
  pos_encoding_type: index
  # encoder_type: conv | linear | residual
  #   conv     – Conv1d PointNet-style with global context injection (default)
  #   linear   – MLP (Linear + LayerNorm + GELU), original implementation
  #   residual – MLP with residual block, no LayerNorm, LeakyReLU
  encoder_type: linear

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 150
  batch_size: 512
  learning_rate: 6.0e-4
  warmup_epochs: 15
  min_learning_rate: 1.0e-6
  weight_decay: 5e-6
  loss_type: mse        # mse | l1 | smooth_l1 | log_mse | log_l1
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 8
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/combined_polynomial_ring3
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: combined-polynomial-ring3
  log_file: ./checkpoints/combined_polynomial_ring3/train.log
