# Training config: Combined Polynomial Surfaces – Ring 2
# Variant: Conv1d encoder + spatial positional encoding + max_mean pooling
#
# Trains GaussianPatchTransformer on the combined polynomial dataset
# (Paraboloid + Saddle + HyperbolicParaboloid, all levels & lights).
#
# Prerequisites – generate patches first:
#   bash scripts/generate_polynomial_training_patches.sh
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/combined_polynomial_ring2_spatial_maxmean.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/combined_polynomial_all.yaml
  ring: 2
  train_split: 0.8
  use_r1_min: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: GaussianPatchDropout
      max_dropout_ratio: 0.5
  # Full dataset – all ~2.2M examples
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.1
  drop_path_rate: 0.1
  point_attributes: null  # null = use all attributes
  # pool: max | mean | max_mean  (default: max)
  # max_mean concatenates max and mean → head input is 3×embed_dim
  pool: max_mean
  # pos_encoding_type: index | spatial | relative_bias
  #   spatial – sinusoidal on relative 3-D XYZ position (requires xyz in attributes)
  pos_encoding_type: spatial
  # encoder_type: conv | linear | residual
  #   conv     – Conv1d PointNet-style with global context injection
  #   linear   – MLP (Linear + LayerNorm + GELU), original implementation
  #   residual – MLP with residual block, no LayerNorm, LeakyReLU
  encoder_type: conv

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 100
  batch_size: 512
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  loss_type: log_l1         # mse | l1 | smooth_l1 | log_mse | log_l1
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 10
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/combined_polynomial_ring2_spatial_maxmean
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: combined-polynomial-ring2-spatial-maxmean
  log_file: ./checkpoints/combined_polynomial_ring2_spatial_maxmean/train.log
