# Training config: Combined Polynomial Surfaces – Ring 3 (outlier filtering, 4 sources)
# Variant: linear encoder + index positional encoding, four geodesic sources
#
# Trains GaussianPatchTransformer on the combined polynomial dataset
# (Paraboloid + Saddle + HyperbolicParaboloid, all levels & lights)
# with num_sources=4 patches and outlier filtering enabled.
#
# Prerequisites – generate outlier filtering patches first:
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/outlier_filtering/paraboloid_all.yaml
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/outlier_filtering/saddle_all.yaml
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/outlier_filtering/hyperbolic_paraboloid_all.yaml
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/outlier_filtering/combined_polynomial_ring3.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/outlier_filtering/combined_polynomial_all.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: SparseContextDropout
      min_valid: 1
      max_valid_ratio: 1.00
      p: 0.5
      p_dropout: 1
      max_dropout_ratio: 0.99
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0005
  attn_dropout: 0.0005
  drop_path_rate: 0.0005
  point_attributes: null
  pool: max
  pos_encoding_type: index
  encoder_type: linear

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 100
  batch_size: 512
  learning_rate: 5.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-5
  loss_type: mse
  warmup_epochs: 15
  gradient_clip_norm: 1.0
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 15
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/outlier_filtering/combined_polynomial_ring3
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: outlier-filtering-combined-polynomial-ring3
  log_file: ./checkpoints/outlier_filtering/combined_polynomial_ring3/train.log
