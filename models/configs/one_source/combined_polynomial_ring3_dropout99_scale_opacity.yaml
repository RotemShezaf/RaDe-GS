# Training config: Combined Polynomial Surfaces – Ring 3, high dropout + scale+opacity (one source)
# Variant: max_dropout_ratio=0.99, xyz+scale+opacity attributes, one geodesic source
#
# Trains GaussianPatchTransformer on the combined polynomial dataset
# (Paraboloid + Saddle + HyperbolicParaboloid, all levels & lights)
# with num_sources=1 scale+opacity patches.
#
# Prerequisites – generate scale+opacity one-source patches first:
#   bash scripts/polynomial/generate_patches_scale_opacity_one_source_tmux.sh
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/one_source/combined_polynomial_ring3_dropout99_scale_opacity.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/combined_polynomial_all_scale_opacity_one_source.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  attributes:
    - xyz
    - scale
    - opacity
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: GaussianPatchDropout
      max_dropout_ratio: 0.99
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.05
  attn_dropout: 0.05
  drop_path_rate: 0.0
  point_attributes: null
  pool: max
  pos_encoding_type: index
  encoder_type: linear

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 150
  batch_size: 512
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-6
  warmup_epochs: 3
  weight_decay: 1.0e-4
  loss_type: smooth_l1
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 8
  min_delta: 1.0e-5

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/one_source/combined_polynomial_ring3_dropout99_scale_opacity
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: combined-polynomial-ring3-dropout99-scale-opacity-one-source
  log_file: ./checkpoints/one_source/combined_polynomial_ring3_dropout99_scale_opacity/train.log
