# Testing config: Quick sanity-check configuration (100K samples)
# Copied from combined_polynomial_ring2_conv.yaml
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/testing.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/combined_polynomial_all.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: GaussianPatchDropout
      max_dropout_ratio: 0.3
  # Reduced dataset for quick testing
  max_examples: 50000
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 256
  encoder_depth: 6
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.1
  attn_dropout: 0.1
  drop_path_rate: 0.1
  point_attributes: null  # null = use all attributes
  # pool: max | mean | max_mean  (default: max)
  pool: max
  # pos_encoding_type: index | spatial | relative_bias
  #   index   – sinusoidal on sorted-neighbour order (default)
  #   spatial – sinusoidal on relative 3-D XYZ position (requires xyz in attributes)
  pos_encoding_type: index
  # encoder_type: conv | linear | residual
  #   conv     – Conv1d PointNet-style with global context injection (default)
  #   linear   – MLP (Linear + LayerNorm + GELU), original implementation
  #   residual – MLP with residual block, no LayerNorm, LeakyReLU
  encoder_type: linear

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 100
  batch_size: 128
  learning_rate: 3.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 1.0e-4
  loss_type: mse         # mse | l1 | smooth_l1 | log_mse | log_l1
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 8
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/testing
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: testing
  log_file: ./checkpoints/testing/train.log
