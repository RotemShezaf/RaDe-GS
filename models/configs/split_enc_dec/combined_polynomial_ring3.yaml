# Training config: Combined Polynomial Surfaces – Ring 3 (split_enc_dec, 4 sources)
# Variant: SplitEmbeddingEncoderDecoderTransformer, normalize_all_neighbors, no outlier filtering
#
# Prerequisites – generate patches first:
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/paraboloid_all.yaml
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/saddle_all.yaml
#   python DataSets/create_gaussian_training_patches.py --config DataSets/configs/polynomial/split_enc_dec/hyperbolic_paraboloid_all.yaml
#
# Usage:
#   python models/train_gaussian_patch_transformer.py \
#       --train_config models/configs/split_enc_dec/combined_polynomial_ring3.yaml

# ── Dataset ────────────────────────────────────────────────────────────
dataset:
  dataset_config: DataSets/configs/polynomial/split_enc_dec/combined_polynomial_all.yaml
  ring: 3
  train_split: 0.8
  use_r1_min: true
  normalize_all_neighbors: true
  transforms:
    - name: GaussianPatchCanonicalRotate
    - name: SparseContextDropout
      min_valid: 1
      max_valid_ratio: 1.00
      p: 0.3
      p_dropout: 1
      max_dropout_ratio: 0.8
  max_examples: null
  subset_seed: 42

# ── Model ──────────────────────────────────────────────────────────────
model:
  embed_dim: 128
  encoder_depth: 6
  decoder_depth: 3
  num_heads: 8
  mlp_ratio: 4.0
  dropout: 0.0005
  attn_dropout: 0.0005
  drop_path_rate: 0.0005
  point_attributes: null
  pool: max
  encoder_type: linear
  attention_type: split_enc_dec

# ── Training ───────────────────────────────────────────────────────────
training:
  num_epochs: 100
  batch_size: 512
  learning_rate: 8.0e-4
  min_learning_rate: 1.0e-6
  weight_decay: 2.0e-5
  loss_type: blended_mse
  blended_mse_lambda: 0.5
  warmup_epochs: 10
  gradient_clip_norm: 1.0
  seed: 42

# ── Early stopping ─────────────────────────────────────────────────────
early_stopping_cfg:
  early_stopping: true
  patience: 15
  min_delta: 0.0

# ── Infrastructure ─────────────────────────────────────────────────────
infrastructure:
  save_dir: ./checkpoints/split_enc_dec/combined_polynomial_ring3
  save_every: 10
  num_workers: 6

# ── Logging ────────────────────────────────────────────────────────────
logging:
  use_wandb: true
  wandb_project: gaussian-patch-transformer
  wandb_run_name: split-enc-dec-combined-polynomial-ring3
  log_file: ./checkpoints/split_enc_dec/combined_polynomial_ring3/train.log
